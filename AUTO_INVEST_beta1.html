<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#17212b"><title>AUTO INVEST β1</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f6f8;color:#17212b;font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif}header{background:#17212b;color:#fff;padding:42px 22px 28px}header h1{margin:0;font-size:36px}header p{margin:7px 0 0;color:#c6d0d8}main{max-width:900px;margin:auto;padding:18px 15px 100px}.card{background:#fff;border:1px solid #d8e1e7;border-radius:24px;padding:21px;margin-bottom:16px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{background:#f8fafb;border-radius:18px;padding:17px}.small{color:#71808d;font-size:15px}.big{font-size:42px;font-weight:800}.metric b{display:block;font-size:27px;margin-top:5px}h2{font-size:24px;margin:0 0 15px}.score{font-size:40px;font-weight:800}.row{display:flex;justify-content:space-between;align-items:center;padding:13px 0;border-bottom:1px solid #e5ebef}.badge{padding:7px 12px;border-radius:99px;background:#edf6ff;color:#1674b5;font-weight:800}.amount{font-size:20px;font-weight:800}.note{color:#71808d;font-size:14px;line-height:1.6}canvas{width:100%;height:270px;background:#fbfcfd;border-radius:15px;display:block}input,select{width:100%;padding:14px;border:2px solid #d6e0e6;border-radius:14px;background:#fff;font-size:18px}label{display:block;color:#71808d;margin:14px 0 6px}button{width:100%;padding:16px;border:0;border-radius:16px;background:#1688dc;color:#fff;font-size:19px;font-weight:800;margin-top:16px}.hidden{display:none}footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d8e1e7;display:flex;justify-content:center;gap:55px;padding:11px;z-index:5}footer button{width:auto;background:none;color:#0879c8;margin:0;padding:5px 20px;font-size:16px}
</style></head><body>
<header><h1>AUTO INVEST β1</h1><p>自動分析・自動配分・バックテスト</p></header>
<main><section id="home">
<div class="card"><div class="small">シミュレーション総資産</div><div id="total" class="big">---</div><div id="gain" class="note">---</div></div>
<div class="grid"><div class="metric"><div class="small">今月の予算</div><b id="budget">---</b></div><div class="metric"><div class="small">投資判断</div><b id="overall">---</b></div><div class="metric"><div class="small">投資元本</div><b id="principal">---</b></div><div class="metric"><div class="small">最大下落</div><b id="dd">---</b></div></div>
<div class="card"><h2>🤖 AUTO INVEST 判断</h2><div id="signal" class="score">---</div><p id="reason" class="note"></p></div>
<div class="card"><h2>📈 資産推移</h2><canvas id="chart"></canvas></div>
<div class="card"><h2>🏆 銘柄ランキング</h2><div id="ranking"></div></div>
<div class="card"><h2>💰 今月の自動配分</h2><div id="allocation"></div></div>
<div class="card"><h2>📊 バックテスト</h2><div class="grid"><div class="metric"><div class="small">最終資産</div><b id="final">---</b></div><div class="metric"><div class="small">年率</div><b id="annual">---</b></div><div class="metric"><div class="small">最大下落</div><b id="maxdd">---</b></div><div class="metric"><div class="small">売買回数</div><b id="trades">---</b></div></div></div>
</section>
<section id="settings" class="card hidden"><h2>⚙️ 設定</h2><label>初期資金</label><input id="initial" type="number" value="1000000"><label>毎月の投資予算</label><input id="monthly" type="number" value="50000"><label>期間</label><select id="years"><option>1</option><option selected>3</option><option>5</option><option>10</option></select><label>配分</label><select id="style"><option value="score" selected>スコア重視</option><option value="equal">均等配分</option></select><button onclick="run()">🚀 自動分析する</button><p class="note">現在は実際の注文を行いません。外部CSV/APIを使わない検証版です。</p></section></main>
<footer><button onclick="tab(1)">🏠 ホーム</button><button onclick="tab(0)">⚙️ 設定</button></footer>
<script>
const $=x=>document.getElementById(x),A=[['S&P500',.007,.032],['NASDAQ100',.009,.048],['TOPIX',.0055,.038],['日経225',.006,.043]];let chart=[];
function tab(h){$('home').classList.toggle('hidden',!h);$('settings').classList.toggle('hidden',h);scrollTo(0,0)}
function money(x){return '¥'+Math.round(x).toLocaleString('ja-JP')}function pct(x){return(x>=0?'+':'')+x.toFixed(2)+'%'}
function series(y,d,v){let p=100,a=[p];for(let i=1;i<=y*12;i++){p*=Math.max(.72,1+d+Math.sin(i*.73)*v*.45+Math.sin(i*.17)*v*.22+(i%47==17?-.07:0)+(i%61==31?-.045:0));a.push(p)}return a}
function draw(a){let c=$('chart'),d=devicePixelRatio||1,r=c.getBoundingClientRect(),w=r.width,h=r.height;c.width=w*d;c.height=h*d;let x=c.getContext('2d');x.setTransform(d,0,0,d,0,0);let mi=Math.min(...a),ma=Math.max(...a);x.clearRect(0,0,w,h);x.beginPath();a.forEach((v,i)=>{let xx=55+(w-70)*i/(a.length-1),yy=20+(h-55)*(1-(v-mi)/(ma-mi));i?x.lineTo(xx,yy):x.moveTo(xx,yy)});x.strokeStyle='#1688dc';x.lineWidth=3;x.stroke()}
function run(){let I=+$('initial').value||1,M=+$('monthly').value||0,Y=+$('years').value,rows=A.map(q=>{let s=series(Y,q[1],q[2]),last=s.at(-1),avg=s.slice(-6).reduce((a,b)=>a+b,0)/6,sc=Math.max(1,Math.min(99,Math.round(55+(last/avg-1)*220)));return{name:q[0],s,score:sc}}).sort((a,b)=>b.score-a.score);let w=rows.map(r=>$('style').value=='equal'?25:r.score),sum=w.reduce((a,b)=>a+b,0),alloc=w.map(x=>Math.round(M*x/sum/1000)*1000);alloc[0]+=M-alloc.reduce((a,b)=>a+b,0);let best=rows[0],units=0,vals=[I],principal=I;for(let i=1;i<best.s.length;i++){principal+=M;units+=(M/best.s[i]);vals.push(units*best.s[i])}let fin=vals.at(-1),peak=I,dd=0;for(let v of vals){peak=Math.max(peak,v);dd=Math.min(dd,v/peak-1)}let ann=(Math.pow(fin/I,1/Y)-1)*100,overall=Math.round(rows.reduce((a,b)=>a+b.score,0)/4);$('total').textContent=money(fin);$('gain').textContent=money(fin-principal);$('budget').textContent=money(M);$('principal').textContent=money(principal);$('overall').textContent=overall+'/100';$('dd').textContent=(dd*100).toFixed(2)+'%';$('signal').textContent=overall>=70?'🟢 BUY':overall>=50?'🟡 HOLD':'🔴 WAIT';$('reason').textContent=best.name+'が現在の最上位候補。スコアはトレンドを基にした検証値です。';$('ranking').innerHTML=rows.map((r,i)=>'<div class="row"><div>'+(i+1)+'️⃣ '+r.name+'<div class="small">スコア '+r.score+'/100</div></div><span class="badge">'+(r.score>=70?'BUY':r.score>=50?'HOLD':'WAIT')+'</span></div>').join('');$('allocation').innerHTML=rows.map((r,i)=>'<div class="row"><span>'+r.name+'</span><span class="amount">'+money(alloc[i])+'</span></div>').join('');$('final').textContent=money(fin);$('annual').textContent=pct(ann);$('maxdd').textContent=(dd*100).toFixed(2)+'%';$('trades').textContent=best.s.length-1;chart=vals;draw(vals);tab(1)}
addEventListener('load',run);addEventListener('resize',()=>chart.length&&draw(chart));
</script></body></html>
