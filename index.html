<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="apple-mobile-web-app-capable" content="yes"><title>AUTO INVEST</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f6f8;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;color:#17202a}.app{max-width:520px;margin:auto;background:white;min-height:100vh}header{background:#17202a;color:white;padding:30px 18px 16px}.brand{font-size:22px;font-weight:900}.sub{font-size:12px;color:#bdc6ce}main{padding:15px 15px 90px}.card{border:1px solid #e3e8ec;border-radius:18px;padding:16px;margin-bottom:13px}.money{font-size:30px;font-weight:900}.gain{color:#16824f;font-weight:800}.loss{color:#b3261e;font-weight:800}.muted{color:#7b858e;font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.metric{background:#f7f9fa;border-radius:13px;padding:12px}.metric b{display:block;font-size:18px;margin-top:3px}.input,.select{width:100%;padding:12px;border:1px solid #d9dfe5;border-radius:12px;margin:6px 0 12px;font-size:16px;background:#fff}.btn{width:100%;border:0;border-radius:12px;padding:13px;background:#17202a;color:#fff;font-weight:850}.row{display:flex;justify-content:space-between;margin:9px 0}.pill{display:inline-block;padding:5px 9px;border-radius:999px;background:#eee;font-weight:800}.buy{background:#e8f7ef;color:#16824f}.sell{background:#fff0ef;color:#b3261e}canvas{width:100%;height:210px;background:#fafbfc;border-radius:14px}.status{padding:10px;background:#f7f9fa;border-radius:12px;font-size:12px;line-height:1.5}.notice{font-size:11px;color:#707a83;line-height:1.6}.hidden{display:none}nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(520px,100%);display:flex;justify-content:space-around;background:#fff;border-top:1px solid #ddd;padding:10px}nav button{border:0;background:none;font-weight:800}
</style></head><body><div class="app"><header><div class="brand">AUTO INVEST</div><div class="sub">実データ・バックテスト版</div></header><main>
<section id="result"><div class="card"><div class="muted">バックテスト最終資産</div><div class="money" id="final">—</div><div id="profit">—</div><div class="muted" id="period"></div></div>
<div class="grid"><div class="metric"><span class="muted">年率</span><b id="cagr">—</b></div><div class="metric"><span class="muted">最大下落</span><b id="mdd">—</b></div><div class="metric"><span class="muted">売買回数</span><b id="trades">—</b></div><div class="metric"><span class="muted">現在判断</span><b id="signal">—</b></div></div>
<div class="card"><b>📈 実際の価格推移</b><canvas id="chart" width="1000" height="420"></canvas></div>
<div class="card"><b>🤖 投資判断スコア</b><div class="row"><span>トレンド</span><b id="trend">—</b></div><div class="row"><span>モメンタム</span><b id="momentum">—</b></div><div class="row"><span>総合</span><b id="score">—</b></div><p class="notice">20・50・200期間移動平均と直近リターンによる検証用ルールです。利益を保証するAIではありません。</p></div>
<div class="card"><div class="status" id="status">設定から実データでバックテストしてください。</div></div></section>
<section id="settings" class="hidden"><div class="card"><b>⚙️ 条件設定</b>
<label class="muted">銘柄</label><select id="ticker" class="select"><option value="VOO">S&P500 ETF (VOO)</option><option value="SPY">S&P500 ETF (SPY)</option><option value="QQQ">NASDAQ100 ETF (QQQ)</option><option value="^N225">日経平均</option><option value="AAPL">Apple</option><option value="MSFT">Microsoft</option><option value="NVDA">NVIDIA</option></select>
<label class="muted">期間</label><select id="range" class="select"><option value="5y">5年</option><option value="10y" selected>10年</option><option value="max">最大</option></select>
<label class="muted">初期資金</label><input id="initial" class="input" type="number" value="1000000">
<label class="muted">毎月積立</label><input id="monthly" class="input" type="number" value="50000">
<label class="muted">戦略</label><select id="strategy" class="select"><option value="trend">トレンド追随</option><option value="dca">積立のみ</option><option value="balanced">バランス</option></select>
<button class="btn" onclick="backtest()">実データでバックテスト</button></div>
<div class="card"><p class="notice">この版はブラウザからYahoo Financeのチャートデータを取得します。ネットワークや提供側仕様で取得できない場合があります。売買注文は行いません。</p></div></section></main>
<nav><button onclick="tab('result')">📈 結果</button><button onclick="tab('settings')">⚙️ 設定</button></nav>
<script>
const $=x=>document.getElementById(x);let dates=[];
function tab(x){$('result').classList.toggle('hidden',x!='result');$('settings').classList.toggle('hidden',x!='settings')}
function yen(n){return '¥'+Math.round(n).toLocaleString('ja-JP')}
function avg(a,i,n){if(i+1<n)return null;let s=0;for(let j=i-n+1;j<=i;j++)s+=a[j];return s/n}
function score(a,i){let m20=avg(a,i,20),m50=avg(a,i,50),m200=avg(a,i,200),mom=i>=6?a[i]/a[i-6]-1:0,s=0;if(m20&&a[i]>m20)s+=25;if(m50&&a[i]>m50)s+=25;if(m200&&a[i]>m200)s+=30;if(mom>0)s+=20;return{s,m200,mom}}
async function data(t,r){let u='https://query1.finance.yahoo.com/v8/finance/chart/'+encodeURIComponent(t)+'?range='+r+'&interval=1mo&events=history&includeAdjustedClose=true';let q=await fetch(u);if(!q.ok)throw Error('HTTP '+q.status);let j=await q.json(),z=j.chart.result?.[0];if(!z)throw Error('データなし');dates=[];let a=z.indicators.adjclose?.[0]?.adjclose||z.indicators.quote?.[0]?.close;return a.map((v,i)=>{if(v!=null){dates.push(z.timestamp[i]);return +v}}).filter(v=>v!=null)}
async function backtest(){tab('result');$('status').textContent='実データを取得中…';try{let t=$('ticker').value,a=await data(t,$('range').value),initial=+$('initial').value||0,monthly=+$('monthly').value||0,strategy=$('strategy').value;if(a.length<12)throw Error('データ不足');let cash=initial,units=0,value=initial,peak=initial,mdd=0,trades=0,invested=initial;for(let i=0;i<a.length;i++){if(i>0){cash+=monthly;invested+=monthly}let s=score(a,i),buy=strategy=='dca'||(strategy=='balanced'?s.s>=55:s.s>=60);if(buy&&cash>0){units+=cash/a[i];cash=0;trades++}else if(strategy!='dca'&&units>0&&s.s<35){cash+=units*a[i];units=0;trades++}value=cash+units*a[i];peak=Math.max(peak,value);mdd=Math.min(mdd,value/peak-1)}let years=Math.max((a.length-1)/12,1),cagr=Math.pow(value/Math.max(initial,1),1/years)-1,s=score(a,a.length-1);$('final').textContent=yen(value);$('profit').textContent=(value-invested>=0?'+':'')+yen(value-invested);$('profit').className=value>=invested?'gain':'loss';$('period').textContent=t+' / 月次データ '+a.length+'点 / 元本 '+yen(invested);$('cagr').textContent=(cagr*100).toFixed(2)+'%';$('mdd').textContent=(mdd*100).toFixed(2)+'%';$('trades').textContent=trades;let sig=s.s>=60?'買い':s.s<35?'売り':'保有';$('signal').innerHTML='<span class="pill '+(sig=='買い'?'buy':sig=='売り'?'sell':'')+'">'+sig+'</span>';$('trend').textContent=s.m200?(a.at(-1)>s.m200?'上向き':'下向き'):'判定待ち';$('momentum').textContent=(s.mom*100).toFixed(1)+'%';$('score').textContent=s.s+'/100';$('status').textContent='実データ取得成功。端末上でバックテストしました。';draw(a)}catch(e){$('status').textContent='取得失敗：'+e.message+'。Safariで再読み込みするか別銘柄を試してください。';}}
function draw(a){let c=$('chart'),x=c.getContext('2d');x.clearRect(0,0,c.width,c.height);let mi=Math.min(...a),ma=Math.max(...a);x.beginPath();a.forEach((v,i)=>{let px=i/(a.length-1)*c.width,py=c.height-25-(v-mi)/(ma-mi||1)*(c.height-50);i?x.lineTo(px,py):x.moveTo(px,py)});x.strokeStyle='#16824f';x.lineWidth=5;x.stroke()}
tab('settings');
</script></div></body></html>
