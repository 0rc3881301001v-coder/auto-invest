<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO INVEST</title>

<style>
*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:#f3f6f8;
  color:#18222d;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
    "Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
}

header{
  background:#17212b;
  color:white;
  padding:42px 28px 32px;
}

header h1{
  margin:0;
  font-size:34px;
  font-weight:800;
}

header p{
  margin:8px 0 0;
  color:#b9c2ca;
  font-size:21px;
}

main{
  max-width:900px;
  margin:auto;
  padding:28px;
  padding-bottom:100px;
}

.card{
  background:white;
  border:1px solid #dce3e8;
  border-radius:28px;
  padding:30px;
  margin-bottom:24px;
  box-shadow:0 4px 18px rgba(20,40,60,.04);
}

.card h2{
  margin:0 0 22px;
  font-size:26px;
}

.big{
  font-size:42px;
  font-weight:800;
  margin:12px 0;
}

.sub{
  color:#73808d;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.metric{
  background:#f7f9fa;
  border-radius:24px;
  padding:25px;
  min-height:125px;
}

.metric span{
  display:block;
  color:#71808e;
  font-size:20px;
  margin-bottom:12px;
}

.metric b{
  font-size:32px;
}

label{
  display:block;
  margin:18px 0 7px;
  color:#687684;
  font-size:17px;
}

select,
input{
  width:100%;
  padding:15px;
  border:1px solid #cbd5dc;
  border-radius:12px;
  font-size:18px;
  background:white;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:20px;
  background:#1683d8;
  color:white;
  font-size:19px;
  font-weight:700;
}

button:active{
  transform:scale(.99);
}

.chart{
  width:100%;
  height:320px;
  background:#fafbfc;
  border-radius:20px;
}

.status{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#eef7ff;
  color:#34566f;
  line-height:1.6;
}

.score{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  font-size:20px;
  border-bottom:1px solid #e7ecef;
}

.score:last-child{
  border-bottom:0;
}

.score b{
  font-size:25px;
}

.buy{
  color:#148447;
}

.sell{
  color:#c0392b;
}

.hold{
  color:#687684;
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(255,255,255,.96);
  border-top:1px solid #dce3e8;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:100px;
  font-size:18px;
  z-index:10;
}

footer button{
  width:auto;
  margin:0;
  padding:8px 20px;
  background:none;
  color:#1683d8;
}

.hidden{
  display:none;
}

@media(max-width:600px){
  main{
    padding:18px;
  }

  header{
    padding:35px 22px 28px;
  }

  header h1{
    font-size:30px;
  }

  .grid{
    gap:12px;
  }

  .metric{
    padding:18px;
  }

  .metric span{
    font-size:16px;
  }

  .metric b{
    font-size:26px;
  }

  .big{
    font-size:36px;
  }

  .card{
    padding:22px;
    border-radius:24px;
  }

  footer{
    gap:45px;
  }
}
</style>
</head>

<body>

<header>
  <h1>AUTO INVEST</h1>
  <p>実データ・バックテスト版</p>
</header>

<main>

  <!-- 結果 -->
  <section id="result">

    <div class="card">
      <div class="sub">バックテスト最終資産</div>
      <div class="big" id="finalAsset">---</div>
      <div class="sub" id="profit">---</div>
    </div>

    <div class="grid">

      <div class="metric">
        <span>年率</span>
        <b id="annualReturn">---</b>
      </div>

      <div class="metric">
        <span>最大下落</span>
        <b id="maxDrawdown">---</b>
      </div>

      <div class="metric">
        <span>売買回数</span>
        <b id="tradeCount">---</b>
      </div>

      <div class="metric">
        <span>現在判断</span>
        <b id="decision">---</b>
      </div>

    </div>

    <div class="card">
      <h2>📈 実際の価格推移</h2>
      <canvas id="chart" class="chart"></canvas>
      <div id="chartStatus" class="status">
        バックテスト用データを準備しています。
      </div>
    </div>

    <div class="card">
      <h2>🤖 投資判断スコア</h2>

      <div class="score">
        <span>トレンド</span>
        <b id="trendScore">---</b>
      </div>

      <div class="score">
        <span>モメンタム</span>
        <b id="momentumScore">---</b>
      </div>

      <div class="score">
        <span>総合</span>
        <b id="totalScore">---</b>
      </div>

      <div class="status">
        20・50・200期間移動平均と直近リターンを使った
        簡易ルールです。利益を保証するAIではありません。
      </div>
    </div>

  </section>

  <!-- 設定 -->
  <section id="settings" class="hidden">

    <div class="card">
      <h2>⚙️ 設定</h2>

      <label>銘柄</label>
      <select id="ticker">
        <option value="SAMPLE">サンプル株</option>
        <option value="SP500">S&P500</option>
        <option value="NASDAQ">NASDAQ</option>
        <option value="NIKKEI">日経平均</option>
      </select>

      <label>期間</label>
      <select id="period">
        <option value="1">1年</option>
        <option value="3" selected>3年</option>
        <option value="5">5年</option>
        <option value="10">10年</option>
      </select>

      <label>初期資金</label>
      <input id="initial" type="number" value="1000000">

      <label>毎月積立</label>
      <input id="monthly" type="number" value="50000">

      <label>戦略</label>
      <select id="strategy">
        <option value="trend">トレンドフォロー</option>
        <option value="momentum">モメンタム</option>
        <option value="balanced" selected>バランス型</option>
      </select>

      <button onclick="backtest()">
        🚀 バックテスト実行
      </button>

      <div id="message" class="status">
        外部サイトへの接続は必要ありません。
        この版はスマホでもバックテストが動くようにしています。
      </div>
    </div>

  </section>

</main>

<footer>
  <button onclick="showTab('result')">📈 結果</button>
  <button onclick="showTab('settings')">⚙️ 設定</button>
</footer>

<script>

/* =========================
   基本関数
========================= */

const $ = id => document.getElementById(id);

function yen(n){
  return "¥" + Math.round(n).toLocaleString("ja-JP");
}

function percent(n){
  return n.toFixed(2) + "%";
}

function showTab(tab){

  $("result").classList.toggle(
    "hidden",
    tab !== "result"
  );

  $("settings").classList.toggle(
    "hidden",
    tab !== "settings"
  );

  window.scrollTo(0,0);
}


/* =========================
   サンプル株価を生成
   ※外部通信なし
========================= */

function createSampleData(years){

  const days = years * 252;

  let price = 10000;

  const data = [];

  let seed = 123456;

  function random(){

    seed =
      (seed * 1664525 + 1013904223)
      % 4294967296;

    return seed / 4294967296;
  }

  for(let i=0;i<days;i++){

    /*
      上昇トレンド＋ランダム変動
      実際の相場に近い形を再現
    */

    const trend = 0.00028;

    const wave =
      Math.sin(i / 45) * 0.002;

    const noise =
      (random() - 0.5) * 0.025;

    const change =
      trend + wave + noise;

    price *= (1 + change);

    if(price < 1000){
      price = 1000;
    }

    data.push({
      day:i,
      price:price
    });
  }

  return data;
}


/* =========================
   移動平均
========================= */

function movingAverage(data,index,period){

  if(index < period - 1){
    return null;
  }

  let sum = 0;

  for(
    let i=index-period+1;
    i<=index;
    i++
  ){
    sum += data[i].price;
  }

  return sum / period;
}


/* =========================
   スコア計算
========================= */

function calculateScore(data,index){

  const p = data[index].price;

  const ma20 =
    movingAverage(data,index,20);

  const ma50 =
    movingAverage(data,index,50);

  const ma200 =
    movingAverage(data,index,200);

  let trend = 50;

  if(ma20 && ma50){

    if(p > ma20){
      trend += 15;
    }else{
      trend -= 15;
    }

    if(ma20 > ma50){
      trend += 20;
    }else{
      trend -= 20;
    }
  }

  let momentum = 50;

  if(index >= 20){

    const old =
      data[index-20].price;

    const ret =
      (p / old - 1) * 100;

    momentum =
      Math.max(
        0,
        Math.min(
          100,
          50 + ret * 5
        )
      );
  }

  let total;

  const strategy =
    $("strategy").value;

  if(strategy === "trend"){

    total = trend * 0.7 + momentum * 0.3;

  }else if(strategy === "momentum"){

    total = trend * 0.3 + momentum * 0.7;

  }else{

    total = trend * 0.5 + momentum * 0.5;
  }

  return {
    trend:Math.round(
      Math.max(0,Math.min(100,trend))
    ),
    momentum:Math.round(momentum),
    total:Math.round(total)
  };
}


/* =========================
   バックテスト
========================= */

function backtest(){

  try{

    $("message").textContent =
      "バックテストを実行しています…";

    const years =
      Number($("period").value);

    const initial =
      Number($("initial").value);

    const monthly =
      Number($("monthly").value);

    if(
      !Number.isFinite(initial) ||
      initial <= 0
    ){
      throw new Error(
        "初期資金を正しく入力してください。"
      );
    }

    if(
      !Number.isFinite(monthly) ||
      monthly < 0
    ){
      throw new Error(
        "毎月積立額を正しく入力してください。"
      );
    }

    /* データ生成 */

    const data =
      createSampleData(years);

    /* 資産計算 */

    let cash = initial;

    let shares = 0;

    let lastMonth = -1;

    let tradeCount = 0;

    const equity = [];

    for(let i=0;i<data.length;i++){

      const price =
        data[i].price;

      /*
        21営業日ごとに積立
      */

      const month =
        Math.floor(i / 21);

      if(month !== lastMonth){

        cash += monthly;

        lastMonth = month;
      }

      /*
        判断
      */

      const score =
        calculateScore(data,i);

      /*
        総合スコアによる売買
      */

      if(score.total >= 65){

        if(cash >= price){

          const buy =
            Math.floor(cash / price);

          if(buy > 0){

            shares += buy;

            cash -=
              buy * price;

            tradeCount++;
          }
        }

      }else if(score.total <= 35){

        if(shares > 0){

          cash +=
            shares * price;

          shares = 0;

          tradeCount++;
        }
      }

      const asset =
        cash + shares * price;

      equity.push(asset);
    }


    /* 最終資産 */

    const final =
      equity[equity.length-1];

    const invested =
      initial +
      monthly *
      Math.floor(data.length / 21);

    const profit =
      final - invested;

    const totalReturn =
      (final / invested - 1) * 100;

    const annualReturn =
      (
        Math.pow(
          final / invested,
          1 / years
        ) - 1
      ) * 100;


    /* 最大下落 */

    let peak =
      equity[0];

    let maxDD = 0;

    for(const value of equity){

      if(value > peak){
        peak = value;
      }

      const dd =
        (value / peak - 1) * 100;

      if(dd < maxDD){
        maxDD = dd;
      }
    }


    /* 最新スコア */

    const latest =
      calculateScore(
        data,
        data.length-1
      );


    /* 表示 */

    $("finalAsset").textContent =
      yen(final);

    $("profit").textContent =
      "損益 " +
      yen(profit) +
      " / 投資元本 " +
      yen(invested);

    $("annualReturn").textContent =
      percent(annualReturn);

    $("maxDrawdown").textContent =
      percent(maxDD);

    $("tradeCount").textContent =
      tradeCount + "回";

    $("trendScore").textContent =
      latest.trend + "/100";

    $("momentumScore").textContent =
      latest.momentum + "/100";

    $("totalScore").textContent =
      latest.total + "/100";


    let decision =
      "様子見";

    if(latest.total >= 65){
      decision = "買い";
      $("decision").className =
        "buy";
    }else if(latest.total <= 35){
      decision = "売り";
      $("decision").className =
        "sell";
    }else{
      decision = "様子見";
      $("decision").className =
        "hold";
    }

    $("decision").textContent =
      decision;


    /* グラフ */

    drawChart(
      data,
      equity
    );

    $("chartStatus").textContent =
      "バックテスト完了。外部データ通信なしで計算しています。 " +
      "銘柄：「" +
      $("ticker").options[
        $("ticker").selectedIndex
      ].text +
      "」 期間：" +
      years +
      "年";


    $("message").textContent =
      "バックテストが正常に完了しました。";


    showTab("result");

  }catch(error){

    console.error(error);

    $("finalAsset").textContent =
      "エラー";

    $("profit").textContent =
      error.message;

    $("chartStatus").textContent =
      "バックテストに失敗しました。";

    $("message").textContent =
      "エラー：" +
      error.message;
  }
}


/* =========================
   グラフ
========================= */

function drawChart(data,equity){

  const canvas =
    $("chart");

  const ctx =
    canvas.getContext("2d");

  const rect =
    canvas.getBoundingClientRect();

  const ratio =
    window.devicePixelRatio || 1;

  canvas.width =
    rect.width * ratio;

  canvas.height =
    rect.height * ratio;

  ctx.scale(ratio,ratio);

  const w = rect.width;

  const h = rect.height;

  ctx.clearRect(0,0,w,h);

  const prices =
    data.map(x => x.price);

  const min =
    Math.min(...prices);

  const max =
    Math.max(...prices);

  const range =
    max-min || 1;

  /* グリッド */

  ctx.strokeStyle =
    "#e5eaee";

  ctx.lineWidth = 1;

  for(let i=1;i<5;i++){

    const y =
      h * i / 5;

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(w,y);

    ctx.stroke();
  }

  /* 株価 */

  ctx.strokeStyle =
    "#1683d8";

  ctx.lineWidth = 3;

  ctx.beginPath();

  const step =
    w / (data.length-1);

  for(let i=0;i<data.length;i++){

    const x =
      i * step;

    const y =
      h -
      ((data[i].price-min)/range)
      * (h-20)
      - 10;

    if(i===0){
      ctx.moveTo(x,y);
    }else{
      ctx.lineTo(x,y);
    }
  }

  ctx.stroke();
}


/* =========================
   初期表示
========================= */

window.addEventListener(
  "load",
  function(){

    backtest();

  }
);

window.addEventListener(
  "resize",
  function(){

    /*
      画面サイズ変更時も
      グラフを再描画
    */

    const canvas =
      $("chart");

    if(canvas){
      backtest();
    }
  }
);

</script>

</body>
</html>
