<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUTO INVEST</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#f3f6f8;
  color:#18222d;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",
  "Hiragino Kaku Gothic ProN","Yu Gothic",Arial,sans-serif;
}

header{
  background:#17212b;
  color:white;
  padding:42px 28px 32px;
}

header h1{
  margin:0;
  font-size:34px;
  font-weight:800;
}

header p{
  margin:8px 0 0;
  color:#b9c2ca;
  font-size:21px;
}

main{
  max-width:900px;
  margin:auto;
  padding:28px;
  padding-bottom:100px;
}

.card{
  background:white;
  border:1px solid #dce3e8;
  border-radius:28px;
  padding:30px;
  margin-bottom:24px;
  box-shadow:0 4px 18px rgba(20,40,60,.04);
}

.card h2{
  margin:0 0 22px;
  font-size:26px;
}

.big{
  font-size:42px;
  font-weight:800;
  margin:12px 0;
}

.sub{
  color:#73808d;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:16px;
}

.metric{
  background:#f7f9fa;
  border-radius:24px;
  padding:25px;
  min-height:125px;
}

.metric span{
  display:block;
  color:#71808e;
  font-size:20px;
  margin-bottom:12px;
}

.metric b{
  font-size:32px;
}

.chart{
  width:100%;
  height:320px;
  background:#fafbfc;
  border-radius:20px;
}

.status{
  margin-top:18px;
  padding:16px;
  border-radius:14px;
  background:#eef7ff;
  color:#34566f;
  line-height:1.6;
}

label{
  display:block;
  margin:18px 0 7px;
  color:#687684;
  font-size:17px;
}

select,
input{
  width:100%;
  padding:15px;
  border:1px solid #cbd5dc;
  border-radius:12px;
  font-size:18px;
  background:white;
}

button{
  width:100%;
  border:0;
  border-radius:14px;
  padding:17px;
  margin-top:20px;
  background:#1683d8;
  color:white;
  font-size:19px;
  font-weight:700;
}

.score{
  display:flex;
  justify-content:space-between;
  padding:13px 0;
  font-size:20px;
  border-bottom:1px solid #e7ecef;
}

.score b{
  font-size:25px;
}

.buy{color:#148447}
.sell{color:#c0392b}
.hold{color:#687684}

.hidden{
  display:none;
}

footer{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:70px;
  background:rgba(255,255,255,.97);
  border-top:1px solid #dce3e8;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:100px;
  font-size:18px;
  z-index:10;
}

footer button{
  width:auto;
  margin:0;
  padding:8px 20px;
  background:none;
  color:#1683d8;
}

@media(max-width:600px){

  main{
    padding:18px;
  }

  header{
    padding:35px 22px 28px;
  }

  header h1{
    font-size:30px;
  }

  .grid{
    gap:12px;
  }

  .metric{
    padding:18px;
  }

  .metric span{
    font-size:16px;
  }

  .metric b{
    font-size:26px;
  }

  .big{
    font-size:36px;
  }

  .card{
    padding:22px;
  }

  footer{
    gap:45px;
  }
}
</style>
</head>

<body>

<header>
  <h1>AUTO INVEST</h1>
  <p>実データ・バックテスト版</p>
</header>

<main>

<section id="result">

  <div class="card">
    <div class="sub">バックテスト最終資産</div>
    <div class="big" id="finalAsset">読み込み中…</div>
    <div class="sub" id="profit">実データを取得しています</div>
  </div>

  <div class="grid">

    <div class="metric">
      <span>年率</span>
      <b id="annualReturn">---</b>
    </div>

    <div class="metric">
      <span>最大下落</span>
      <b id="maxDrawdown">---</b>
    </div>

    <div class="metric">
      <span>売買回数</span>
      <b id="tradeCount">---</b>
    </div>

    <div class="metric">
      <span>現在判断</span>
      <b id="decision">---</b>
    </div>

  </div>

  <div class="card">
    <h2>📈 実際の価格推移</h2>
    <canvas id="chart" class="chart"></canvas>

    <div id="chartStatus" class="status">
      実データを取得しています…
    </div>
  </div>

  <div class="card">
    <h2>🤖 投資判断スコア</h2>

    <div class="score">
      <span>トレンド</span>
      <b id="trendScore">---</b>
    </div>

    <div class="score">
      <span>モメンタム</span>
      <b id="momentumScore">---</b>
    </div>

    <div class="score">
      <span>総合</span>
      <b id="totalScore">---</b>
    </div>

    <div class="status">
      20日・50日・200日移動平均と
      直近リターンを使った投資判断です。
      利益を保証するAIではありません。
    </div>

  </div>

</section>


<section id="settings" class="hidden">

  <div class="card">

    <h2>⚙️ 設定</h2>

    <label>銘柄</label>

    <select id="ticker">

      <option value="^GSPC">
        S&P500
      </option>

      <option value="^IXIC">
        NASDAQ総合
      </option>

      <option value="^N225">
        日経平均
      </option>

      <option value="7203.T">
        トヨタ自動車
      </option>

      <option value="6758.T">
        ソニーグループ
      </option>

      <option value="9984.T">
        ソフトバンクグループ
      </option>

      <option value="AAPL">
        Apple
      </option>

      <option value="MSFT">
        Microsoft
      </option>

      <option value="NVDA">
        NVIDIA
      </option>

    </select>


    <label>期間</label>

    <select id="period">

      <option value="1">
        1年
      </option>

      <option value="3" selected>
        3年
      </option>

      <option value="5">
        5年
      </option>

      <option value="10">
        10年
      </option>

    </select>


    <label>初期資金</label>

    <input
      id="initial"
      type="number"
      value="1000000"
    >


    <label>毎月積立</label>

    <input
      id="monthly"
      type="number"
      value="50000"
    >


    <label>戦略</label>

    <select id="strategy">

      <option value="trend">
        トレンド重視
      </option>

      <option value="momentum">
        モメンタム重視
      </option>

      <option value="balanced" selected>
        バランス型
      </option>

    </select>


    <button onclick="backtest()">
      🚀 バックテスト実行
    </button>


    <div id="message" class="status">
      Yahoo Financeの実データを取得します。
    </div>

  </div>

</section>

</main>


<footer>

  <button onclick="showTab('result')">
    📈 結果
  </button>

  <button onclick="showTab('settings')">
    ⚙️ 設定
  </button>

</footer>


<script>

/* =========================
   基本
========================= */

const $ = id =>
  document.getElementById(id);


function yen(n){

  return "¥" +
    Math.round(n).toLocaleString("ja-JP");

}


function percent(n){

  return n.toFixed(2) + "%";

}


function showTab(tab){

  $("result").classList.toggle(
    "hidden",
    tab !== "result"
  );

  $("settings").classList.toggle(
    "hidden",
    tab !== "settings"
  );

  window.scrollTo(0,0);

}


/* =========================
   Yahoo Finance 実データ取得
========================= */

async function getYahooData(ticker,years){

  const url =
    "https://query1.finance.yahoo.com/v8/finance/chart/" +
    encodeURIComponent(ticker) +
    "?range=" +
    years +
    "y" +
    "&interval=1d" +
    "&events=history" +
    "&includeAdjustedClose=true";

  const response =
    await fetch(url);

  if(!response.ok){

    throw new Error(
      "Yahoo Financeへの接続に失敗しました"
    );

  }

  const json =
    await response.json();

  if(
    !json.chart ||
    !json.chart.result ||
    !json.chart.result[0]
  ){

    throw new Error(
      "株価データが取得できませんでした"
    );

  }

  const result =
    json.chart.result[0];

  const timestamps =
    result.timestamp;

  const quote =
    result.indicators.quote[0];

  if(
    !timestamps ||
    !quote ||
    !quote.close
  ){

    throw new Error(
      "株価データが空です"
    );

  }

  const data=[];

  for(let i=0;i<timestamps.length;i++){

    const price =
      quote.close[i];

    if(
      price !== null &&
      Number.isFinite(price)
    ){

      data.push({

        date:
          new Date(
            timestamps[i]*1000
          ),

        price:
          Number(price)

      });

    }

  }

  if(data.length < 200){

    throw new Error(
      "バックテストに必要なデータが不足しています"
    );

  }

  return data;

}


/* =========================
   移動平均
========================= */

function movingAverage(
  data,
  index,
  period
){

  if(index < period-1){
    return null;
  }

  let sum=0;

  for(
    let i=index-period+1;
    i<=index;
    i++
  ){

    sum += data[i].price;

  }

  return sum/period;

}


/* =========================
   スコア
========================= */

function calculateScore(
  data,
  index
){

  const price =
    data[index].price;

  const ma20 =
    movingAverage(
      data,
      index,
      20
    );

  const ma50 =
    movingAverage(
      data,
      index,
      50
    );

  const ma200 =
    movingAverage(
      data,
      index,
      200
    );


  let trend=50;


  if(ma20 && ma50){

    if(price > ma20){
      trend += 15;
    }else{
      trend -= 15;
    }


    if(ma20 > ma50){
      trend += 20;
    }else{
      trend -= 20;
    }


    if(ma50 && ma200){

      if(ma50 > ma200){
        trend += 15;
      }else{
        trend -= 15;
      }

    }

  }


  trend =
    Math.max(
      0,
      Math.min(100,trend)
    );


  let momentum=50;


  if(index >= 20){

    const old =
      data[index-20].price;

    const ret =
      (price/old-1)*100;

    momentum =
      50 + ret*4;

    momentum =
      Math.max(
        0,
        Math.min(
          100,
          momentum
        )
      );

  }


  let total;


  const strategy =
    $("strategy").value;


  if(strategy==="trend"){

    total =
      trend*0.7 +
      momentum*0.3;

  }
  else if(strategy==="momentum"){

    total =
      trend*0.3 +
      momentum*0.7;

  }
  else{

    total =
      trend*0.5 +
      momentum*0.5;

  }


  return {

    trend:
      Math.round(trend),

    momentum:
      Math.round(momentum),

    total:
      Math.round(total)

  };

}


/* =========================
   バックテスト
========================= */

function runBacktest(
  data,
  initial,
  monthly
){

  let cash =
    initial;

  let shares=0;

  let tradeCount=0;

  let lastMonth=-1;

  const equity=[];


  for(let i=0;i<data.length;i++){

    const price =
      data[i].price;


    /*
      約21営業日を1か月として積立
    */

    const month =
      Math.floor(i/21);


    if(month!==lastMonth){

      if(i>0){

        cash += monthly;

      }

      lastMonth=month;

    }


    const score =
      calculateScore(
        data,
        i
      );


    /*
      買い
      65以上
    */

    if(score.total>=65){

      if(cash>=price){

        const buy =
          Math.floor(
            cash/price
          );

        if(buy>0){

          shares += buy;

          cash -=
            buy*price;

          tradeCount++;

        }

      }

    }


    /*
      売り
      35以下
    */

    else if(
      score.total<=35
    ){

      if(shares>0){

        cash +=
          shares*price;

        shares=0;

        tradeCount++;

      }

    }


    equity.push(
      cash+
      shares*price
    );

  }


  return {

    equity,
    final:
      equity[equity.length-1],
    tradeCount

  };

}


/* =========================
   グラフ
========================= */

function drawChart(data){

  const canvas =
    $("chart");

  const ctx =
    canvas.getContext("2d");


  const rect =
    canvas.getBoundingClientRect();


  const ratio =
    window.devicePixelRatio || 1;


  canvas.width =
    rect.width*ratio;

  canvas.height =
    rect.height*ratio;


  ctx.scale(
    ratio,
    ratio
  );


  const w =
    rect.width;

  const h =
    rect.height;


  ctx.clearRect(
    0,
    0,
    w,
    h
  );


  const prices =
    data.map(
      x=>x.price
    );


  const min =
    Math.min(...prices);

  const max =
    Math.max(...prices);


  const range =
    max-min || 1;


  /*
    グリッド
  */

  ctx.strokeStyle =
    "#e3e8ec";

  ctx.lineWidth=1;


  for(let i=1;i<5;i++){

    const y =
      h*i/5;

    ctx.beginPath();

    ctx.moveTo(0,y);

    ctx.lineTo(w,y);

    ctx.stroke();

  }


  /*
    価格ライン
  */

  ctx.strokeStyle =
    "#1683d8";

  ctx.lineWidth=3;

  ctx.beginPath();


  const step =
    w/
    (data.length-1);


  for(
    let i=0;
    i<data.length;
    i++
  ){

    const x =
      i*step;


    const y =
      h-
      (
        (data[i].price-min)
        /range
      )*
      (h-20)-10;


    if(i===0){

      ctx.moveTo(
        x,
        y
      );

    }else{

      ctx.lineTo(
        x,
        y
      );

    }

  }


  ctx.stroke();

}


/* =========================
   メイン
========================= */

async function backtest(){

  try{

    $("message").textContent =
      "実データを取得しています…";


    $("finalAsset").textContent =
      "読み込み中…";


    const ticker =
      $("ticker").value;


    const years =
      Number(
        $("period").value
      );


    const initial =
      Number(
        $("initial").value
      );


    const monthly =
      Number(
        $("monthly").value
      );


    if(
      !Number.isFinite(initial) ||
      initial<=0
    ){

      throw new Error(
        "初期資金を正しく入力してください"
      );

    }


    if(
      !Number.isFinite(monthly) ||
      monthly<0
    ){

      throw new Error(
        "毎月積立額を正しく入力してください"
      );

    }


    /*
      実データ取得
    */

    const data =
      await getYahooData(
        ticker,
        years
      );


    $("chartStatus").textContent =
      "実データ取得成功：" +
      ticker +
      " / " +
      data.length +
      "営業日";


    /*
      バックテスト
    */

    const result =
      runBacktest(
        data,
        initial,
        monthly
      );


    const final =
      result.final;


    /*
      投資元本
    */

    const months =
      Math.floor(
        data.length/21
      );


    const invested =
      initial+
      monthly*months;


    const profit =
      final-invested;


    /*
      年率
    */

    const annualReturn =
      (
        Math.pow(
          final/invested,
          1/years
        )-1
      )*100;


    /*
      最大下落
    */

    let peak =
      result.equity[0];

    let maxDD=0;


    for(
      const value
      of result.equity
    ){

      if(value>peak){

        peak=value;

      }


      const dd =
        (
          value/peak-1
        )*100;


      if(dd<maxDD){

        maxDD=dd;

      }

    }


    /*
      最新スコア
    */

    const latest =
      calculateScore(
        data,
        data.length-1
      );


    /*
      表示
    */

    $("finalAsset").textContent =
      yen(final);


    $("profit").textContent =
      "損益 " +
      yen(profit) +
      " / 投資元本 " +
      yen(invested);


    $("annualReturn").textContent =
      percent(annualReturn);


    $("maxDrawdown").textContent =
      percent(maxDD);


    $("tradeCount").textContent =
      result.tradeCount+
      "回";


    $("trendScore").textContent =
      latest.trend+
      "/100";


    $("momentumScore").textContent =
      latest.momentum+
      "/100";


    $("totalScore").textContent =
      latest.total+
      "/100";


    const decision =
      $("decision");


    if(latest.total>=65){

      decision.textContent =
        "買い";

      decision.className =
        "buy";

    }
    else if(
      latest.total<=35
    ){

      decision.textContent =
        "売り";

      decision.className =
        "sell";

    }
    else{

      decision.textContent =
        "様子見";

      decision.className =
        "hold";

    }


    /*
      グラフ
    */

    drawChart(data);


    $("message").textContent =
      "✅ 実データでバックテスト完了";


    showTab("result");


  }catch(error){

    console.error(error);


    $("finalAsset").textContent =
      "データ取得エラー";


    $("profit").textContent =
      error.message;


    $("chartStatus").textContent =
      "実データを取得できませんでした。" +
      " 設定画面から再実行してください。";


    $("message").textContent =
      "⚠️ " +
      error.message;

  }

}


/* =========================
   初期起動
========================= */

window.addEventListener(
  "load",
  function(){

    backtest();

  }
);


/*
  画面回転・サイズ変更
*/

window.addEventListener(
  "resize",
  function(){

    const canvas =
      $("chart");

    if(
      canvas &&
      !$("result").classList.contains("hidden")
    ){

      /*
        現在のデータがある場合のみ
        再描画
      */

    }

  }
);

</script>

</body>
</html>
